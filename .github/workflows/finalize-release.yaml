# Triggered on a new release git tag pushed, starts the final steps of a release.
#
# Steps currently include
#   1. Updating master changelogs using JS script

name: Finalize Release

on:
  workflow_dispatch:
  push:
    branches:
    - 'release/*'
    paths:
    - '**/CHANGELOG.md'

permissions:
  # The push uses IMJS_ADMIN_GH_TOKEN via GIT_ASKPASS, never GITHUB_TOKEN.
  contents: read

jobs:
  finalize:
    name: Cherry-pick Changelogs
    runs-on: ubuntu-latest
    environment: admin-approval
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.ref }} # checkouts the branch that triggered the workflow
          fetch-depth: 0
          # Not persisted; token access is scoped to the push step below only.
          persist-credentials: false
      - name: Set Git Config
        run: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin

      # actions/setup-node v6.5.0
      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.x"

      - name: Run update-changelogs.mjs
        id: prepare
        run: node ./.github/workflows/automation-scripts/update-changelogs.mjs

      # GIT_ASKPASS avoids the token ever appearing in argv/ps/.git/config.
      - name: Push finalized release
        if: steps.prepare.outputs.refs != ''
        env:
          IMJS_ADMIN_GH_TOKEN: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}
        run: |
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '#!/bin/sh\necho "$IMJS_ADMIN_GH_TOKEN"\n' > "$askpass"
          chmod +x "$askpass"
          GIT_ASKPASS="$askpass" git -c credential.https://github.com.username=x-access-token \
            push --atomic origin ${{ steps.prepare.outputs.refs }}
