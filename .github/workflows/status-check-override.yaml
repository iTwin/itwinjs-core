# This config will fake successful status checks for individual CI events in a pull
# request when it detects *only* changes in the files listed below; i.e., the files
# listed under "paths:".
#
# While this config will fake a successful status check, it does *not* forego running the
# real status check. That needs to be handled by each status check events' own config;
# i.e., a Github Action's or Azure Pipeline's .yaml file.
#
# For example, if the "rush lint + extract-api" status check is faked, the ci.yaml config
# needs to know for what files it should not run. (It will be faked as a successful
# check, so there is no need for it to run.)
#
# Why does this exist?
# The itwinjs-core repo requires certain status checks to be marked successful or
# neutral* to allow a pull request to be merged. Since some changes are limited in scope
# (e.g., a documentation change) or do not affect the application at all (e.g., a
# CODEOWNERS file change), there is no need to wait for or spend resources on every CI
# build to run.
#
# *Note: When Azure Pipeline builds (triggered by Azure DevOps webhooks) skip running due to
# path exclusions, their status checks are set neutral by Azure DevOps. This satisfies
# GitHub's "required" check and thus these status checks do not need to be faked below.

# HOW TO: Add New Files To The Exclusion List
# 1. Add the path glob to the "paths:" list below.
# 2. Add the same paths to the `allowed_path` function in the "Get specific changed files" step below.
# 3. For any status check that should potentially be skipped and/or faked, go to the
#    status check's config and add the relevant paths to the paths exclusion list.
#    ("paths-ignore" for Github Actions and "paths.exclude" for Azure Pipelines.)

name: Skip Check

# SECURITY: pull_request_target keeps this workflow on trusted base-branch code while
# allowing its narrowly scoped token to create checks for fork PRs. Never check out,
# source, or execute code from the pull request head in this workflow.
on:
  pull_request_target:
    branches:
      - master
      - release/*
    paths:
      - "**.md"
      - docs/**
      - .github/CODEOWNERS
      - common/changes/**/*.json
      - "**/CHANGELOG.json"
      - "**/CHANGELOG.md"

jobs:
  detect-if-skip:
    name: Detect If Skip
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      # Check for certain paths having been modified
      - name: Get specific changed files
        id: changed-files-specific
        env:
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_HEAD_BEFORE=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.head.sha')
          if [ "$CURRENT_HEAD_BEFORE" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The pull request head changed before file inspection; required checks will not be faked."
            echo "only_modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep filenames as JSON so unusual Git filenames cannot affect record boundaries
          # or inject workflow commands into the log.
          FILES_JSON=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --paginate --slurp)

          CURRENT_HEAD_AFTER=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.head.sha')
          if [ "$CURRENT_HEAD_AFTER" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The pull request head changed during file inspection; required checks will not be faked."
            echo "only_modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both the event's changed_files count and the files endpoint are capped at 3,000.
          # Fail closed at that cap because the response may be incomplete. For renames,
          # both the old and new paths must be eligible so moving source code into docs
          # cannot incorrectly fake required checks.
          RESULT=$(jq -c --argjson expected "$EXPECTED_CHANGED_FILES" '
            def allowed_path:
              endswith(".md")
              or startswith("docs/")
              or . == ".github/CODEOWNERS"
              or (startswith("common/changes/") and endswith(".json"))
              or ((split("/") | last) == "CHANGELOG.json")
              or ((split("/") | last) == "CHANGELOG.md");

            (add // []) as $files
            | {
                fetched: ($files | length),
                only_modified: (
                  $expected < 3000
                  and ($files | length) == $expected
                  and all($files[];
                    (.filename | allowed_path)
                    and (
                      .status != "renamed"
                      or ((.previous_filename? // "") | allowed_path)
                    )
                  )
                )
              }
          ' <<< "$FILES_JSON")

          FETCHED_CHANGED_FILES=$(jq -r '.fetched' <<< "$RESULT")
          ONLY_MODIFIED=$(jq -r '.only_modified' <<< "$RESULT")
          echo "Expected $EXPECTED_CHANGED_FILES changed files; fetched $FETCHED_CHANGED_FILES."
          echo "only_modified=$ONLY_MODIFIED" >> "$GITHUB_OUTPUT"

      # Fake required checks if necessary
      - name: Fake required checks
        if: steps.changed-files-specific.outputs.only_modified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPLETED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for CHECK_NAME in "rush check" "rush change" "rush audit" "rush lint + extract-api"; do
            gh api "repos/${{ github.repository }}/check-runs" \
              --method POST \
              --field name="$CHECK_NAME" \
              --field head_sha="${{ github.event.pull_request.head.sha }}" \
              --field status="completed" \
              --field conclusion="success" \
              --field completed_at="$COMPLETED_AT"
          done

      # Add more status checks below if necessary

      # TEMPLATE
      # - name: Fake <name-of-any-status-check-to-simulate> check
      #   if: steps.changed-files-specific.outputs.only_modified == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh api "repos/${{ github.repository }}/check-runs" \
      #       --method POST \
      #       --field name="<name-of-any-status-check-to-simulate>" \
      #       --field head_sha="${{ github.event.pull_request.head.sha }}" \
      #       --field status="completed" \
      #       --field conclusion="success" \
      #       --field completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
