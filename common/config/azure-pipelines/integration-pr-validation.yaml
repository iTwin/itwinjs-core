# iTwin.js Core Integration PR Validation Build
#
# To decrease build load, only the latest Node version is tested on pull requests.
# All other versions are run on `master` and `release/*` branches.
#
# Note: Currently a subset of all integration tests

trigger:
  - master
  - release/*
pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - master
      - release/*
  paths:
    exclude:
      - "**.md"
      - docs/**
      - .github/CODEOWNERS
      - common/changes/**/*.json
      - "**/CHANGELOG.json"
      - "**/CHANGELOG.md"

variables:
  - group: iTwin.js non-secret config variables
  - group: iTwin.js Integration Test Users
  - group: Rush Build Cache SAS Token

jobs:
  - job: Node_24_x
    condition: succeeded()
    pool:
      # Pinned: @itwin/oidc-signin-tool postinstall uses Playwright <1.61, which fails on Ubuntu 26.04.
      # Revert to ubuntu-latest once fixed: https://github.com/iTwin/auth-clients/issues/377
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - template: templates/integration-test-steps.yaml
        parameters:
          nodeVersion: 24.x
