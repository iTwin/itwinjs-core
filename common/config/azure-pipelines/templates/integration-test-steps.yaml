parameters:
  - name: nodeVersion # name of the parameter; required
    type: string # data type of the parameter; required

  # When false, skips the graphics-heavy Core full-stack tests (Chrome + Electron
  # renderer suites). Used by Node-compatibility lanes that do not own renderer coverage.
  - name: runRendererTests
    type: boolean
    default: true

  # Rush build-cache reads. Cache entries are keyed [os]-[arch]-[hash] with no
  # Node-version contribution, so lanes that exist to prove a specific Node version
  # can build the packages must pass 0 to avoid restoring output built under a
  # different Node version.
  - name: rushBuildCacheEnabled
    type: number
    default: 1

steps:
  - template: setup-integration-users.yaml

  - task: UseNode@1
    displayName: "Use Node ${{ parameters.nodeVersion }}"
    inputs:
      version: "${{ parameters.nodeVersion }}"
      checkLatest: true

  - script: "git config --local user.email imodeljs-admin@users.noreply.github.com"
    displayName: "git config email"
  - script: "git config --local user.name imodeljs-admin"
    displayName: "git config name"

  - script: node ./common/scripts/install-run-rush install
    displayName: rush install

  # Build every package needed by the integration test suites in a single Rush
  # invocation. Each frontend test package (and @itwin/core-electron) already runs
  # webpack:test as part of its normal build script, so no separate webpack pass is needed.
  #
  # The build cache is READ-ONLY here (RUSH_BUILD_CACHE_WRITE_ALLOWED: 0): these
  # pipelines can be queued manually against arbitrary refs, so they must never
  # publish to the shared cache. Cache entries are written only by trusted
  # master/release CI builds (see core-build.yaml).
  - script: >
      node ./common/scripts/install-run-rush build -v
      --to backend-integration-tests
      --to core-full-stack-tests
      --to @itwin/ecschema-rpcinterface-tests
      --to rpc-full-stack-tests
      --to rpcinterface-full-stack-tests
    displayName: "Rush build"
    env:
      RUSH_BUILD_CACHE_CREDENTIAL: $(RushBuildCacheSAS)
      RUSH_BUILD_CACHE_ENABLED: ${{ parameters.rushBuildCacheEnabled }}
      RUSH_BUILD_CACHE_WRITE_ALLOWED: 0

  # Electron 42+ no longer downloads the binary during npm install (postinstall removed).
  # Ensure the binary is present before configuring the AppArmor profile.
  - script: |
      ELECTRON_DIR=$(find $PWD/common/temp/node_modules/.pnpm -path "*/electron@*/node_modules/electron" -type d 2>/dev/null | head -n 1)
      if [ ! -d "$ELECTRON_DIR" ]; then
        echo "##vso[task.logissue type=warning]Unable to find Electron package directory"
      elif [ -f "$ELECTRON_DIR/dist/electron" ]; then
        echo "Electron binary already present"
      elif [ -f "$ELECTRON_DIR/install.js" ]; then
        echo "Downloading Electron binary..."
        node "$ELECTRON_DIR/install.js"
      else
        echo "##vso[task.logissue type=warning]Unable to find Electron install script at $ELECTRON_DIR/install.js"
      fi
    displayName: "Ensure Electron binary is downloaded"
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  # Starting Ubuntu 24.04, unprivileged user namespaces are restricted by default via AppArmor.
  # Electron's sandbox requires user namespaces, so we create an AppArmor profile that grants the 'userns' permission to the Electron binary.
  # See: https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#p-99950-unprivileged-user-namespace-restrictions-15
  - script: |
      ELECTRON_PATH=$(find $PWD/common/temp/node_modules/.pnpm -path "*/electron@*/node_modules/electron/dist/electron" -type f 2>/dev/null | head -n 1)
      if [ -x "$ELECTRON_PATH" ]; then
        PROFILE_NAME="electron-test"
        PROFILE_PATH="/etc/apparmor.d/${PROFILE_NAME}"
        sudo tee "$PROFILE_PATH" > /dev/null <<EOF
      abi <abi/4.0>,
      include <tunables/global>

      profile ${PROFILE_NAME} ${ELECTRON_PATH} flags=(unconfined) {
        userns,
      }
      EOF
        sudo apparmor_parser -r "$PROFILE_PATH"
        echo "Loaded AppArmor profile for $ELECTRON_PATH"
      else
        echo "##vso[task.logissue type=warning]Unable to find Electron binary for AppArmor profile"
      fi
    displayName: "Setup AppArmor profile for Electron"
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  - script: npm run test:integration
    workingDirectory: "full-stack-tests/backend"
    env:
      NODE_ENV: development
    displayName: "Run Backend Tests"
    condition: succeededOrFailed()

  - ${{ if eq(parameters.runRendererTests, true) }}:
      # Linux agents do not have a real display so use the virtual framebuffer
      - script: xvfb-run --auto-servernum --server-args='-screen 0, 1600x900x24' npm run test:integration
        workingDirectory: "full-stack-tests/core"
        env:
          NODE_ENV: development
        displayName: "Run Core Full Stack Tests"
        condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

      # MacOS and Windows agents work without any virtual display
      - script: npm run test:integration
        workingDirectory: "full-stack-tests/core"
        env:
          NODE_ENV: development
        displayName: "Run Core Full Stack Tests"
        condition: and(succeededOrFailed(), ne(variables['Agent.OS'], 'Linux'))

  - script: npm run test:integration
    workingDirectory: "full-stack-tests/ecschema-rpc-interface"
    env:
      NODE_ENV: development
    displayName: "Run ECSchema RPC Interface Tests"
    condition: succeededOrFailed()

  # By default linux agents do not have a real display so use the virtual framebuffer
  - script: xvfb-run --auto-servernum --server-args='-screen 0, 1600x900x24' npm run test
    workingDirectory: "full-stack-tests/rpc"
    env:
      NODE_ENV: development
    displayName: "Run RPC Full Stack Tests"
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  # MacOS and Windows agents work without any virtual display
  - script: npm run test
    workingDirectory: "full-stack-tests/rpc"
    displayName: "Run RPC Full Stack Tests"
    condition: and(succeededOrFailed(), ne(variables['Agent.OS'], 'Linux'))

  - script: npm run test:integration
    workingDirectory: "full-stack-tests/rpc-interface"
    env:
      NODE_ENV: development
    displayName: "Run RPC Interface Full Stack Tests"
    condition: succeededOrFailed()

  # By default linux agents do not have a real display so use the virtual framebuffer
  - script: xvfb-run --auto-servernum --server-args='-screen 0, 1600x900x24' npm run test:integration:frontend
    workingDirectory: "core/electron"
    env:
      NODE_ENV: development
    displayName: "Run Electron Frontend Tests"
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  # MacOS and Windows agents work without any virtual display
  - script: npm run test:integration:frontend
    workingDirectory: "core/electron"
    env:
      NODE_ENV: development
    displayName: "Run Electron Frontend Tests"
    condition: and(succeededOrFailed(), ne(variables['Agent.OS'], 'Linux'))

  # By default linux agents do not have a real display so use the virtual framebuffer
  - script: xvfb-run --auto-servernum --server-args='-screen 0, 1600x900x24' npm run test:integration:backend
    workingDirectory: "core/electron"
    env:
      NODE_ENV: development
    displayName: "Run Electron Backend Tests"
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  # MacOS and Windows agents work without any virtual display
  - script: npm run test:integration:backend
    workingDirectory: "core/electron"
    displayName: "Run Electron Backend Tests"
    condition: and(succeededOrFailed(), ne(variables['Agent.OS'], 'Linux'))

  - task: PublishTestResults@2
    displayName: "Publish Backend Test Results"
    inputs:
      testResultsFiles: "full-stack-tests/backend/lib/test/junit_results.xml"
      testRunTitle: "Core - Backend Tests - ${{ parameters.nodeVersion }}"
    continueOnError: true
    condition: succeededOrFailed()

  - ${{ if eq(parameters.runRendererTests, true) }}:
      - task: PublishTestResults@2
        displayName: "Publish Core Integration Test Results (Chrome)"
        inputs:
          testResultsFiles: "full-stack-tests/core/lib/test/junit_results_chrome.xml"
          testRunTitle: "Core - Integration Tests (Chrome) - ${{ parameters.nodeVersion }}"
        condition: succeededOrFailed()

      - task: PublishTestResults@2
        displayName: "Publish Core Integration Test Results (Electron)"
        inputs:
          testResultsFiles: "full-stack-tests/core/lib/test/junit_results_electron.xml"
          testRunTitle: "Core - Integration Tests (Electron) - ${{ parameters.nodeVersion }}"
        condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: "Publish ECSchema Rpc Interface Integration Test Results"
    inputs:
      testResultsFiles: "full-stack-tests/ecschema-rpc-interface/ecschema-rpcinterface-tests-result/ecschema-rpcinterface-tests-result.xml"
      testRunTitle: "ECSchema Rpc Interface - Integration Tests - ${{ parameters.nodeVersion }}"
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: "Publish RPC Full Stack Test Results"
    inputs:
      testResultsFiles: "full-stack-tests/rpc/lib/test/junit_results.xml"
      testRunTitle: "RPC Full Stack - ${{ parameters.nodeVersion }}"
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: "Publish Rpc Interface Integration Test Results"
    inputs:
      testResultsFiles: "full-stack-tests/rpc-interface/full_stack_test_results/full_stack_test_result.xml"
      testRunTitle: "Rpc Interface - Integration Tests - ${{ parameters.nodeVersion }}"
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: "Publish Presentation Integration Test Results"
    inputs:
      testResultsFiles: full-stack-tests/presentation/lib/test/junit_results.xml
      testRunTitle: "Presentation - Integration Tests - ${{ parameters.nodeVersion }}"
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: "Publish Electron Test Results"
    inputs:
      testResultsFiles: core/electron/lib/test/*_junit_results.xml
      testRunTitle: "Core - Electron Tests - ${{ parameters.nodeVersion }}"
    condition: succeededOrFailed()
