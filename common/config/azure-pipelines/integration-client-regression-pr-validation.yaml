# iTwin.js Core Integration Client Regression PR Validation Build
#
# This integration test job uses the older internal 'imsoidcui' IMS authority and
# OIDC clients to make sure that workflow is still supported.

trigger:
  - master
pr: none

variables:
  - group: iModel.js non-secret config variables
  - group: iModel.js Integration Test Users
  - group: Rush Build Cache SAS Token

jobs:
  - job: Node_24_x
    condition: succeeded()
    pool:
      # Pinned: @itwin/oidc-signin-tool postinstall uses Playwright <1.61, which fails on Ubuntu 26.04.
      # Revert to ubuntu-latest once fixed: https://github.com/iTwin/auth-clients/issues/377
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - template: templates/integration-test-steps.yaml
        parameters:
          nodeVersion: 24.x
