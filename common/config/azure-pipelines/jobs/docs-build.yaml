      # Currently BeMetalsmith is an internal only tool
      # TEMPORARY (issue #2299 timing test): only one of the two steps below runs per pipeline
      # invocation, selected via the bmsTestMode parameter, so each approach's timing is measured
      # in isolation without warm-cache/network contamination from the other.
      - bash: |
          echo "=== [TEST] Timing: npm install approach ==="
          START=$(date +%s)
          npm install @bentley/bemetalsmith@6.x
          END=$(date +%s)
          echo "##[section][TEST] npm install approach took $((END-START)) seconds"
        displayName: "[TEST] Install BeMetalsmith via npm (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'npm'))

      # TEMPORARY: timing comparison for https://github.com/iTwin/itwinjs-backlog/issues/2299
      # Clones and builds BeMetalsmith from source to compare against the npm install approach above.
      - bash: |
          echo "=== [TEST] Timing: git clone + build from source approach ==="
          START=$(date +%s)
          git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" clone --depth 1 https://dev.azure.com/bentleycs/iModelTechnologies/_git/BeMetalsmith "$(Agent.TempDirectory)/BeMetalsmith"
          cd "$(Agent.TempDirectory)/BeMetalsmith"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          END=$(date +%s)
          echo "##[section][TEST] git clone + build approach took $((END-START)) seconds"
        displayName: "[TEST] Clone + build BeMetalsmith from source (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'gitClone'))

