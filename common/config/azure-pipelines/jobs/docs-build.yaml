# The template defines the primary steps for creating the TypeDoc API files, gathering other md files,
# and running a step to combine everything.

parameters:
  - name: checkout
    type: string
    default: self
  - name: workingDir
    type: string
    default: $(Pipeline.Workspace)/itwinjs-core
  - name: stagingDir
    type: string
    default: $(System.ArtifactsDirectory)/staging
  - name: outputDir
    type: string
    default: $(Pipeline.Workspace)/tempDocsBuild
  - name: useCoreDocsArtifact
    type: boolean
    default: false
  - name: useCurrentAppUIDocsArtifact
    type: boolean
    default: false
  - name: useCurrentBisDocsArtifact
    type: boolean
    default: false
  - name: useCurrentPresentationDocsArtifact
    type: boolean
    default: false
  - name: useCurrentTransformerDocsArtifact
    type: boolean
    default: false
  - name: useCurrentAuthClientsDocsArtifact
    type: boolean
    default: false
  - name: useCurrentConnectorFrameworkDocsArtifact
    type: boolean
    default: false
  - name: shouldPublish
    type: boolean
    default: false
  - name: isExternalBuild
    type: boolean
    default: false
  # TEMPORARY (issue #2299 timing test)
  - name: bmsTestMode
    type: string
    default: npm
    values:
      - npm
      - gitClone

jobs:
  - job: DocsBuild
    displayName: Docs Build
    workspace:
      clean: all
    pool:
      name: iModelTechMacArm
      demands: Agent.OS -equals Darwin
    steps:
      - checkout: ${{ parameters.checkout }}
        path: itwinjs-core
        clean: true
      - task: UseNode@1
        displayName: Use Node 24.x
        inputs:
          version: 24.x
          checkLatest: false
      - script: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin
        displayName: Setup git config

      # Only install and build the docs if not using the core artifact
      - script: node common/scripts/install-run-rush.js install
        displayName: rush install
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.useCoreDocsArtifact }}', false))

      - script: node common/scripts/install-run-rush.js build --to-version-policy prerelease-monorepo-lockStep
        displayName: rush build
        workingDirectory: ${{ parameters.workingDir }}
        env:
          RUSH_BUILD_CACHE_CREDENTIAL: $(RushBuildCacheSAS)
          RUSH_BUILD_CACHE_ENABLED: 1
        condition: and(succeeded(), eq('${{ parameters.useCoreDocsArtifact }}', false))

      - script: node common/scripts/install-run-rush.js docs
        displayName: rush docs
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.useCoreDocsArtifact }}', false))

      - bash: |
          branchName="$(Build.SourceBranch)"
          archiveTag=""

          # Add conditions here for branches that should produce archives
          # For example, 'refs/heads/release/5.10.x' should be archived as 'v5':
          # if [[ $branchName == "refs/heads/release/5.10.x" ]]; then
          #   archiveTag="v5"
          # fi

          if [[ -n "$archiveTag" ]]; then
            echo "Adding output variable $archiveTag"
            echo "##vso[task.setvariable variable=archiveTag;]$archiveTag"
          fi
        displayName: Set archive vars if necessary
        condition: and(succeeded(), eq('${{ parameters.shouldPublish }}', true))

      # if using the core artifact, download the Core Generated Docs artifact it to the workingDir using downloadPipelineArtifact task
      - task: DownloadPipelineArtifact@2
        displayName: Download Core Generated Docs Artifact
        inputs:
          source: "specific"
          project: 2c48216e-e72f-48b4-a4eb-40ff1c04e8e4
          pipeline: 7436 # iTwin.js Docs (docs-ci.yaml)
          artifact: Core Generated Docs
          path: ${{ parameters.workingDir }}/generated-docs
        condition: and(succeeded(), eq('${{ parameters.useCoreDocsArtifact }}', true))

      # Gather all the pieces to run BeMetalsmith
      - template: ../templates/gather-docs.yaml
        parameters:
          workingDir: ${{ parameters.workingDir }}
          stagingDir: ${{ parameters.stagingDir }}
          useCurrentAppUIDocsArtifact: ${{ parameters.useCurrentAppUIDocsArtifact }}
          useCurrentBisDocsArtifact: ${{ parameters.useCurrentBisDocsArtifact }}
          useCurrentPresentationDocsArtifact: ${{ parameters.useCurrentPresentationDocsArtifact }}
          useCurrentTransformerDocsArtifact: ${{ parameters.useCurrentTransformerDocsArtifact }}
          useCurrentAuthClientsDocsArtifact: ${{ parameters.useCurrentAuthClientsDocsArtifact }}
          useCurrentConnectorFrameworkDocsArtifact: ${{ parameters.useCurrentConnectorFrameworkDocsArtifact }}

      # Currently BeMetalsmith is an internal only tool
      # TEMPORARY (issue #2299 timing test): only one of the two steps below runs per pipeline
      # invocation, selected via the bmsTestMode parameter, so each approach's timing is measured
      # in isolation without warm-cache/network contamination from the other.
      - bash: |
          echo "=== [TEST] Timing: npm install approach ==="
          START=$(date +%s)
          npm install @bentley/bemetalsmith@6.x
          END=$(date +%s)
          echo "##[section][TEST] npm install approach took $((END-START)) seconds"
        displayName: "[TEST] Install BeMetalsmith via npm (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'npm'))

      # TEMPORARY: timing comparison for https://github.com/iTwin/itwinjs-backlog/issues/2299
      # Clones and builds BeMetalsmith from source to compare against the npm install approach above.
      - bash: |
          echo "=== [TEST] Timing: git clone + build from source approach ==="
          START=$(date +%s)
          git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" clone --depth 1 https://dev.azure.com/bentleycs/iModelTechnologies/_git/BeMetalsmith "$(Agent.TempDirectory)/BeMetalsmith"
          cd "$(Agent.TempDirectory)/BeMetalsmith"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          END=$(date +%s)
          echo "##[section][TEST] git clone + build approach took $((END-START)) seconds"
        displayName: "[TEST] Clone + build BeMetalsmith from source (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'gitClone'))

      # TEMPORARY (issue #2299 timing test): bmsBuild is now run and timed for each approach.
      # npm approach: uses ./node_modules/.bin/bmsBuild installed in the previous step.
      - bash: |
          siteRootFlag=""
          if [ -n "$(archiveTag)" ]; then
            siteRootFlag="--siteRoot $(archiveTag)"
          fi
          echo "=== [TEST] Timing: Run bmsBuild (npm-installed) ==="
          START=$(date +%s)
          ./node_modules/.bin/bmsBuild --strictLinkChecking --topicsMustHaveDesc --source ${{ parameters.stagingDir }} --destination ${{ parameters.outputDir }}/public_build --siteTitle iTwin.js $siteRootFlag
          END=$(date +%s)
          echo "##[section][TEST] Run bmsBuild (npm-installed) took $((END-START)) seconds"
        displayName: "[TEST] Run bmsBuild via npm-installed package (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'npm'))

      # gitClone approach: uses the bmsBuild binary built from source in the previous step.
      - bash: |
          siteRootFlag=""
          if [ -n "$(archiveTag)" ]; then
            siteRootFlag="--siteRoot $(archiveTag)"
          fi
          echo "=== [TEST] Timing: Run bmsBuild (built from source) ==="
          START=$(date +%s)
          node "$(Agent.TempDirectory)/BeMetalsmith/packages/bemetalsmith/build/bmsBuild.js" --strictLinkChecking --topicsMustHaveDesc --source ${{ parameters.stagingDir }} --destination ${{ parameters.outputDir }}/public_build --siteTitle iTwin.js $siteRootFlag
          END=$(date +%s)
          echo "##[section][TEST] Run bmsBuild (built from source) took $((END-START)) seconds"
        displayName: "[TEST] Run bmsBuild via source build (timed)"
        workingDirectory: ${{ parameters.workingDir }}
        condition: and(succeeded(), eq('${{ parameters.bmsTestMode }}', 'gitClone'))

      # TEMPORARY (issue #2299 timing test): publish and tagging steps below are commented out
      # since they're not needed for the BeMetalsmith install/build timing comparison.
      # - publish: ${{ parameters.workingDir }}/generated-docs
      #   artifact: Core Generated Docs
      #   displayName: Publish Core Generated Docs Artifact
      #   condition: and(succeeded(), eq('${{ parameters.shouldPublish }}', true), eq('${{ parameters.useCoreDocsArtifact }}', false))

