# The template defines the primary steps for creating the TypeDoc API files, gathering other md files,
# and running a step to combine everything.

parameters:
  - name: checkout
    type: string
    default: self
  - name: workingDir
    type: string
    default: $(Pipeline.Workspace)/itwinjs-core
  - name: stagingDir
    type: string
    default: $(System.ArtifactsDirectory)/staging
  - name: outputDir
    type: string
    default: $(Pipeline.Workspace)/tempDocsBuild
  - name: useCoreDocsArtifact
    type: boolean
    default: false
  - name: useCurrentAppUIDocsArtifact
    type: boolean
    default: false
  - name: useCurrentBisDocsArtifact
    type: boolean
    default: false
  - name: useCurrentPresentationDocsArtifact
    type: boolean
    default: false
  - name: useCurrentTransformerDocsArtifact
    type: boolean
    default: false
  - name: useCurrentAuthClientsDocsArtifact
    type: boolean
    default: false
  - name: useCurrentConnectorFrameworkDocsArtifact
    type: boolean
    default: false
  - name: shouldPublish
    type: boolean
    default: false
  - name: isExternalBuild
    type: boolean
    default: false
  # TEMPORARY (issue #2299 timing test)
  - name: bmsTestMode
    type: string
    default: npm
    values:
      - npm
      - gitClone

jobs:
  - job: DocsBuild
    displayName: Docs Build
    workspace:
      clean: all
    pool:
      name: iModelTechMacArm
      demands: Agent.OS -equals Darwin
    steps:
      - checkout: ${{ parameters.checkout }}
        path: itwinjs-core
        clean: true
      - task: UseNode@1
        displayName: Use Node 24.x
        inputs:
          version: 24.x
          checkLatest: false
      - script: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin
        displayName: Setup git config

      # TEMPORARY (issue #2299 timing test): rush install/build/docs, archive-tag, core-docs-artifact
      # download, and gather-docs steps are commented out below since they're irrelevant to timing
      # the BeMetalsmith install approaches and would otherwise dominate the pipeline run time.
